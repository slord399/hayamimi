name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - run: pip install sherpa-onnx numpy scipy soundfile pytest
      - run: python -m pytest tests -q
