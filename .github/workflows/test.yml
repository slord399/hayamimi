name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1
          
      - run: pip install sherpa-onnx numpy scipy soundfile pytest
      
      - run: python -m pytest tests -q
