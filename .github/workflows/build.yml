name: Multi-Platform Build & Release

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify ffmpeg installation
        run: ffmpeg -version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name hayamimi-gui --add-data "scripts;scripts" --add-data "locales;locales" gui.py

      - name: Build executable with PyInstaller (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name hayamimi-gui --add-data "scripts:scripts" --add-data "locales:locales" gui.py

      - name: Create release package artifact
        shell: bash
        run: |
          mkdir -p dist/package
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp -r dist/hayamimi-gui/* dist/package/
            python -c "import shutil; shutil.make_archive('dist/hayamimi-windows-x64', 'zip', 'dist/package')"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp -r dist/hayamimi-gui.app dist/package/ || cp -r dist/hayamimi-gui/* dist/package/
            python -c "import shutil; shutil.make_archive('dist/hayamimi-macos-x64', 'zip', 'dist/package')"
          else
            cp -r dist/hayamimi-gui/* dist/package/
            python -c "import shutil; shutil.make_archive('dist/hayamimi-linux-x64', 'gztar', 'dist/package')"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hayamimi-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the release and upload assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Flatten Artifacts Directory
        run: |
          mkdir -p final-release-assets
          find all-artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} final-release-assets/ \;
          ls -la final-release-assets/

      - name: Publish GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            final-release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
